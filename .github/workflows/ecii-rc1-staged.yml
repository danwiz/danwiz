name: ECII RC1 Staged Verification

on:
  push:
    branches:
      - ecii-rc1-verification
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Reconstruct ECII source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/staging-diagnostics
          sed 's/mhGagyS8/mhGigyS8/' staging/ecii-rc1/bundle.part06_09.b64 > /tmp/bundle.part06_09.corrected.b64
          cat \
            staging/ecii-rc1/bundle.part00.b64 \
            staging/ecii-rc1/bundle.part01.b64 \
            staging/ecii-rc1/bundle.part02.b64 \
            staging/ecii-rc1/bundle.part03.b64 \
            staging/ecii-rc1/bundle.part04_05.b64 \
            /tmp/bundle.part06_09.corrected.b64 \
            staging/ecii-rc1/bundle.part10_13.b64 \
            > /tmp/ecii.b64
          echo "a8f2fabf3c206f725a6a1e03d7351855cc687c13c28d82c10ae0083db9563a97  /tmp/ecii.b64" | sha256sum --check - | tee artifacts/staging-diagnostics/base64-integrity.txt
          base64 --decode /tmp/ecii.b64 > /tmp/ecii-rc1-source.tar.xz
          echo "26792b80b1e4d62a2f0c2f65435e4a109218237056d4731714527563fd945ff4  /tmp/ecii-rc1-source.tar.xz" | sha256sum --check - | tee artifacts/staging-diagnostics/archive-integrity.txt
          mkdir -p /tmp/ecii-work
          tar -xJf /tmp/ecii-rc1-source.tar.xz -C /tmp/ecii-work
          test -f /tmp/ecii-work/ecii-modern-reference/ECII.Modern.sln
          chmod +x /tmp/ecii-work/ecii-modern-reference/scripts/*.sh

      - name: Apply RC.11 payment-event persistence fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('/tmp/ecii-work/ecii-modern-reference')

          def replace_once(path: Path, pattern: str, replacement: str, label: str):
              text = path.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one replacement, got {count}')
              path.write_text(updated)

          replace_once(
              root / 'src/ECII.Infrastructure/Persistence/AccountingConfigurations.cs',
              r'builder\.HasMany<AccountingEntry>\("_entries"\)\s*\.WithOne\(\)\s*\.HasForeignKey\(x => x\.JournalId\)\s*\.OnDelete\(DeleteBehavior\.Cascade\);',
              '''builder.HasMany(x => x.Entries)\n            .WithOne()\n            .HasForeignKey(x => x.JournalId)\n            .OnDelete(DeleteBehavior.Cascade);\n\n        builder.Navigation(x => x.Entries)\n            .UsePropertyAccessMode(PropertyAccessMode.Field);''',
              'AccountingJournal.Entries'
          )

          replace_once(
              root / 'src/ECII.Infrastructure/Persistence/PaymentConfiguration.cs',
              r'builder\.HasMany<PaymentEvent>\("_events"\)\s*\.WithOne\(\)\s*\.HasForeignKey\(x => x\.PaymentId\)\s*\.OnDelete\(DeleteBehavior\.Restrict\);',
              '''builder.HasMany(x => x.Events)\n            .WithOne()\n            .HasForeignKey(x => x.PaymentId)\n            .OnDelete(DeleteBehavior.Restrict);\n\n        builder.Navigation(x => x.Events)\n            .UsePropertyAccessMode(PropertyAccessMode.Field);''',
              'Payment.Events'
          )

          repo = root / 'src/ECII.Infrastructure/Persistence/SettlementRepositories.cs'
          text = repo.read_text()
          start = text.index('    public async Task<IReadOnlyList<OutboxMessage>> GetPendingAsync(')
          end = text.index('\n}\n\n\npublic sealed class OutboxAdminRepository', start)
          replacement = '''    public async Task<IReadOnlyList<OutboxMessage>> GetPendingAsync(\n        int take,\n        CancellationToken cancellationToken)\n    {\n        var now = DateTimeOffset.UtcNow;\n\n        if (_db.Database.IsSqlite())\n        {\n            var candidates = await _db.OutboxMessages\n                .Where(x =>\n                    x.DeadLetteredAt == null &&\n                    (x.Status == OutboxStatus.Pending ||\n                     x.Status == OutboxStatus.Failed))\n                .ToListAsync(cancellationToken);\n\n            return candidates\n                .Where(x =>\n                    x.Status == OutboxStatus.Pending ||\n                    x.NextAttemptAt == null ||\n                    x.NextAttemptAt <= now)\n                .OrderBy(x => x.OccurredAt)\n                .Take(take)\n                .ToList();\n        }\n\n        return await _db.OutboxMessages\n            .Where(x =>\n                x.DeadLetteredAt == null &&\n                (x.Status == OutboxStatus.Pending ||\n                 (x.Status == OutboxStatus.Failed &&\n                  (x.NextAttemptAt == null || x.NextAttemptAt <= now))))\n            .OrderBy(x => x.OccurredAt)\n            .Take(take)\n            .ToListAsync(cancellationToken);\n    }'''
          repo.write_text(text[:start] + replacement + text[end:])

          auth = root / 'src/ECII.Api/Security/AdminAuthorization.cs'
          text = auth.read_text()
          if 'return Results.Forbid();' not in text:
              raise SystemExit('AdminAuthorization: expected Results.Forbid() not found')
          auth.write_text(text.replace(
              'return Results.Forbid();',
              'return Results.StatusCode(StatusCodes.Status403Forbidden);',
              1))

          program = root / 'src/ECII.Api/Program.cs'
          text = program.read_text()
          text = text.replace(
              '        payment.Status,\n        payment.CorrelationId,',
              '        payment.Status.ToString(),\n        payment.CorrelationId,',
              1)

          old_summary = '''    var summary = await db.PaymentSettlements\n        .GroupBy(x => x.Status)\n        .Select(g => new\n        {\n            status = g.Key.ToString(),\n            count = g.Count()\n        })\n        .OrderBy(x => x.status)\n        .ToListAsync(ct);\n\n    return Results.Ok(summary);'''
          new_summary = '''    var grouped = await db.PaymentSettlements\n        .GroupBy(x => x.Status)\n        .Select(g => new\n        {\n            Status = g.Key,\n            Count = g.Count()\n        })\n        .ToListAsync(ct);\n\n    var summary = grouped\n        .Select(x => new\n        {\n            status = x.Status.ToString(),\n            count = x.Count\n        })\n        .OrderBy(x => x.status)\n        .ToList();\n\n    return Results.Ok(summary);'''
          if old_summary not in text:
              raise SystemExit('Program reconciliation summary block not found')
          program.write_text(text.replace(old_summary, new_summary, 1))

          tests = root / 'tests/ECII.IntegrationTests/PaymentApiTests.cs'
          tests.write_text('''using System.Net;\nusing System.Net.Http.Json;\nusing ECII.Contracts.Payments;\n\nnamespace ECII.IntegrationTests;\n\npublic sealed class PaymentApiTests\n{\n    [Fact]\n    public async Task Payment_RequiresIdempotencyKey()\n    {\n        using var factory = new ECIIWebApplicationFactory();\n        using var client = factory.CreateClient();\n        client.DefaultRequestHeaders.Add("X-Demo-Subject", "demo-customer");\n        var request = new CreatePaymentRequest(Guid.Parse("44444444-4444-4444-4444-444444444444"), 100m, "JMD", "SCOTIA-SIM", "DEMO-SOURCE");\n        var response = await client.PostAsJsonAsync("/api/payments", request);\n        Assert.Equal(HttpStatusCode.BadRequest, response.StatusCode);\n    }\n\n    [Fact]\n    public async Task ReplayingSameIdempotencyKey_ReturnsSamePayment()\n    {\n        using var factory = new ECIIWebApplicationFactory();\n        using var client = factory.CreateClient();\n        client.DefaultRequestHeaders.Add("X-Demo-Subject", "demo-customer");\n        var request = new CreatePaymentRequest(Guid.Parse("44444444-4444-4444-4444-444444444444"), 100m, "JMD", "SCOTIA-SIM", "DEMO-SOURCE");\n        var key = Guid.NewGuid().ToString("N");\n        using var first = new HttpRequestMessage(HttpMethod.Post, "/api/payments") { Content = JsonContent.Create(request) };\n        first.Headers.Add("Idempotency-Key", key);\n        using var second = new HttpRequestMessage(HttpMethod.Post, "/api/payments") { Content = JsonContent.Create(request) };\n        second.Headers.Add("Idempotency-Key", key);\n        var firstResponse = await client.SendAsync(first);\n        var secondResponse = await client.SendAsync(second);\n        Assert.Equal(HttpStatusCode.Created, firstResponse.StatusCode);\n        Assert.Equal(HttpStatusCode.OK, secondResponse.StatusCode);\n        var firstPayment = await firstResponse.Content.ReadFromJsonAsync<PaymentResponse>();\n        var secondPayment = await secondResponse.Content.ReadFromJsonAsync<PaymentResponse>();\n        Assert.NotNull(firstPayment);\n        Assert.NotNull(secondPayment);\n        Assert.Equal(firstPayment!.PaymentId, secondPayment!.PaymentId);\n    }\n\n    [Fact]\n    public async Task ReusingIdempotencyKeyWithDifferentPayload_ReturnsConflict()\n    {\n        using var factory = new ECIIWebApplicationFactory();\n        using var client = factory.CreateClient();\n        client.DefaultRequestHeaders.Add("X-Demo-Subject", "demo-customer");\n        var key = Guid.NewGuid().ToString("N");\n        var firstRequest = new CreatePaymentRequest(Guid.Parse("44444444-4444-4444-4444-444444444444"), 100m, "JMD", "SCOTIA-SIM", "DEMO-SOURCE");\n        var changedRequest = firstRequest with { Amount = 110m };\n        using var first = new HttpRequestMessage(HttpMethod.Post, "/api/payments") { Content = JsonContent.Create(firstRequest) };\n        first.Headers.Add("Idempotency-Key", key);\n        using var second = new HttpRequestMessage(HttpMethod.Post, "/api/payments") { Content = JsonContent.Create(changedRequest) };\n        second.Headers.Add("Idempotency-Key", key);\n        var firstResponse = await client.SendAsync(first);\n        var secondResponse = await client.SendAsync(second);\n        Assert.Equal(HttpStatusCode.Created, firstResponse.StatusCode);\n        Assert.Equal(HttpStatusCode.Conflict, secondResponse.StatusCode);\n    }\n}\n''')

          # RC.11: a PaymentEvent appended after the aggregate has already been
          # persisted must be classified as Added, not Modified. Leaving its GUID
          # key unset allows EF's generated-key convention to do that correctly.
          payment_domain = root / 'src/ECII.Domain/Payments/Payment.cs'
          text = payment_domain.read_text()
          key_old = '''        new()\n        {\n            Id = Guid.NewGuid(),\n            PaymentId = paymentId,'''
          key_new = '''        new()\n        {\n            Id = Guid.Empty,\n            PaymentId = paymentId,'''
          if key_old not in text:
              raise SystemExit('PaymentEvent.Create GUID assignment not found')
          payment_domain.write_text(text.replace(key_old, key_new, 1))

          payment_cfg = root / 'src/ECII.Infrastructure/Persistence/PaymentConfiguration.cs'
          text = payment_cfg.read_text()
          marker = '''        builder.ToTable("PaymentEvents");\n        builder.HasKey(x => x.Id);'''
          if marker not in text:
              raise SystemExit('PaymentEvent configuration marker not found')
          payment_cfg.write_text(text.replace(
              marker,
              marker + '\n        builder.Property(x => x.Id).ValueGeneratedOnAdd();',
              1))

          persistence_tests = root / 'tests/ECII.IntegrationTests/PaymentPersistenceTests.cs'
          text = persistence_tests.read_text()
          marker = '''    [Fact]\n    public async Task SameCustomerAndIdempotencyKey_IsRejectedByDatabaseConstraint()'''
          regression = '''    [Fact]\n    public async Task LaterTransitionEvent_IsInsertedNotUpdated()\n    {\n        await using var database = await TestDatabase.CreateAsync();\n\n        Guid paymentId;\n        await using (var db = database.CreateContext())\n        {\n            var payment = NewPayment(Guid.NewGuid(), "later-event-key");\n            payment.BeginValidation();\n            payment.Authorize();\n            paymentId = payment.Id;\n            db.Payments.Add(payment);\n            await db.SaveChangesAsync();\n\n            payment.MarkSourceDebited("SCOTIA-LATER-001");\n            await db.SaveChangesAsync();\n        }\n\n        await using var verify = database.CreateContext();\n        var events = await verify.PaymentEvents\n            .Where(x => x.PaymentId == paymentId)\n            .OrderBy(x => x.Sequence)\n            .ToListAsync();\n\n        Assert.Equal(4, events.Count);\n        Assert.Equal(PaymentEventType.SourceDebited, events[^1].EventType);\n        Assert.Equal("SCOTIA-LATER-001", events[^1].ExternalReference);\n    }\n\n'''
          if marker not in text:
              raise SystemExit('PaymentPersistenceTests insertion marker not found')
          persistence_tests.write_text(text.replace(marker, regression + marker, 1))

          (root / 'VERSION').write_text('0.9.9-rc.11\n')
          PY

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run RC1 verification gate
        working-directory: /tmp/ecii-work/ecii-modern-reference
        shell: bash
        run: ./scripts/verify-rc1.sh artifacts/rc1-verification

      - name: Upload staging diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecii-staging-diagnostics-${{ github.sha }}
          path: artifacts/staging-diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload RC1 verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecii-rc1-verification-${{ github.sha }}
          path: /tmp/ecii-work/ecii-modern-reference/artifacts/
          if-no-files-found: warn
          retention-days: 14
