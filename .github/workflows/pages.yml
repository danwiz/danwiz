name: Validate and deploy GitHub Pages

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate required site files
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/index.html
          test -s docs/styles.css
          test -s docs/assets/og-card-1200x630.jpg
          test -s docs/assets/favicon.png
      - name: Validate page metadata and local references
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'lang="en"' docs/index.html
          grep -Fq 'name="description"' docs/index.html
          grep -Fq 'og-card-1200x630.jpg' docs/index.html
          grep -Fq 'assets/favicon.png' docs/index.html
          grep -Fq 'href="styles.css"' docs/index.html
          grep -Fq 'href="#main"' docs/index.html
          ! grep -Eiq '(TODO|FIXME|lorem ipsum|example\.com)' docs/index.html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
